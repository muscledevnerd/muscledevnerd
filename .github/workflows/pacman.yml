name: Generate Contribution Graph Animation

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/pacman.yml"

permissions:
  contents: write

jobs:
  generate:
    name: Generate contribution animation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Pac-Man contribution SVGs
        id: pacman
        continue-on-error: true
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: muscledevnerd
          github_token: ${{ secrets.PROFILE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          games: pacman

      - name: Create Pac-Man fallback SVGs
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def build(path: str, dark: bool) -> None:
              bg = "#0d1117" if dark else "#ffffff"
              surface = "#161b22" if dark else "#f6f8fa"
              border = "#30363d" if dark else "#d0d7de"
              text = "#c9d1d9" if dark else "#24292f"
              muted = "#8b949e" if dark else "#57606a"
              empty = "#1f2633" if dark else "#ebedf0"
              low = "#2d3a64" if dark else "#dbe4ff"
              mid = "#394891" if dark else "#c7d2fe"
              high = "#667eea"
              colors = [empty, low, empty, mid, empty, low, high]
              cells = []
              for col in range(31):
                  for row in range(7):
                      level = (col * 3 + row * 5) % len(colors)
                      fill = colors[level] if (col + row) % 4 == 0 else empty
                      cells.append(f'<rect x="{58 + col * 31}" y="{84 + row * 22}" width="16" height="16" rx="4" fill="{fill}" />')
              svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
            <title id="title">Pac-Man contribution graph for muscledevnerd</title>
            <desc id="desc">Pac-Man themed contribution graph for muscledevnerd. It is refreshed by GitHub Actions and can use PROFILE_GITHUB_TOKEN for broader authorized contribution visibility.</desc>
            <defs>
              <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#667eea" />
                <stop offset="55%" stop-color="#764ba2" />
                <stop offset="100%" stop-color="#f093fb" />
              </linearGradient>
              <style><![CDATA[
                .title {{ font: 800 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: {text}; }}
                .note {{ font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: {muted}; }}
                .pac {{ animation: travel 8s linear infinite; transform-origin: center; }}
                .mouth {{ animation: chomp .45s steps(2, end) infinite; transform-origin: 28px 0; }}
                .ghost {{ animation: bob 2.2s ease-in-out infinite; }}
                @keyframes travel {{ from {{ transform: translateX(0); }} to {{ transform: translateX(830px); }} }}
                @keyframes chomp {{ 50% {{ transform: rotate(18deg); }} }}
                @keyframes bob {{ 0%,100% {{ transform: translateY(0); }} 50% {{ transform: translateY(-8px); }} }}
              ]]></style>
            </defs>
            <rect width="1100" height="300" rx="18" fill="{bg}" />
            <rect x="24" y="24" width="1052" height="252" rx="18" fill="{surface}" stroke="{border}" />
            <text x="54" y="58" class="title">Pac-Man contribution graph</text>
            <g>{''.join(cells)}</g>
            <g class="pac" transform="translate(68 162)">
              <circle cx="0" cy="0" r="22" fill="#ffd166" />
              <path class="mouth" d="M0 0 L28 -15 L28 15 Z" fill="{surface}" />
              <circle cx="4" cy="-10" r="3.5" fill="#111827" />
            </g>
            <g class="ghost" transform="translate(1010 125)">
              <path d="M0 44 V18 C0 -6 18 -22 40 -22 C62 -22 80 -6 80 18 V44 L66 35 L53 44 L40 35 L27 44 L14 35 Z" fill="url(#accent)" opacity="0.92" />
              <circle cx="28" cy="12" r="6" fill="#fff" /><circle cx="52" cy="12" r="6" fill="#fff" />
              <circle cx="30" cy="12" r="2.5" fill="#111827" /><circle cx="54" cy="12" r="2.5" fill="#111827" />
            </g>
            <text x="54" y="252" class="note">Public cards show public GitHub data; add PROFILE_GITHUB_TOKEN for broader authorized contribution visibility.</text>
          </svg>'''
              Path(path).write_text(svg, encoding="utf-8")

          Path("dist").mkdir(exist_ok=True)
          build("dist/pacman-fallback.svg", False)
          build("dist/pacman-fallback-dark.svg", True)
          PY

      - name: Select contribution graph assets
        run: |
          mkdir -p assets
          if [ -f dist/pacman-contribution-graph.svg ] && ! grep -q "<frames>0</frames>" dist/pacman-contribution-graph.svg; then
            cp dist/pacman-contribution-graph.svg assets/pacman-contribution-graph.svg
            cp dist/pacman-contribution-graph-dark.svg assets/pacman-contribution-graph-dark.svg
          else
            cp dist/pacman-fallback.svg assets/pacman-contribution-graph.svg
            cp dist/pacman-fallback-dark.svg assets/pacman-contribution-graph-dark.svg
          fi

      - name: Normalize SVG accessibility metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          title = '<title id="title">Pac-Man contribution graph for muscledevnerd</title>'
          desc = '<desc id="desc">Generated Pac-Man contribution graph animation for muscledevnerd using GitHub Actions.</desc>'
          files = [
              Path("assets/pacman-contribution-graph.svg"),
              Path("assets/pacman-contribution-graph-dark.svg"),
          ]
          for path in files:
              svg = path.read_text(encoding="utf-8")
              first_tag = re.search(r"<svg\b([^>]*)>", svg)
              if not first_tag:
                  raise SystemExit(f"Missing <svg> in {path}")
              attrs = first_tag.group(1)
              width = re.search(r'width="(\d+)"', attrs)
              height = re.search(r'height="(\d+)"', attrs)
              if "viewBox=" not in attrs and width and height:
                  attrs = attrs + f' viewBox="0 0 {width.group(1)} {height.group(1)}"'
              if "role=" not in attrs:
                  attrs = attrs + ' role="img"'
              if "aria-labelledby=" not in attrs:
                  attrs = attrs + ' aria-labelledby="title desc"'
              open_tag = f"<svg{attrs}>"
              svg = svg[:first_tag.start()] + open_tag + svg[first_tag.end():]
              if "<title" not in svg[:500]:
                  svg = svg.replace(open_tag, open_tag + title, 1)
              if "<desc" not in svg[:700]:
                  svg = svg.replace("</title>", "</title>" + desc, 1)
              elif '<desc id=' not in svg[:700]:
                  svg = svg.replace("<desc>", '<desc id="desc">', 1)
              path.write_text(svg, encoding="utf-8")
          PY

      - name: Sync latest branch state
        run: |
          git stash push --include-untracked -m generated-contribution-graph || true
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git stash pop || true

      - name: Commit generated contribution graphs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution graph animation"
          file_pattern: assets/pacman-contribution-graph.svg assets/pacman-contribution-graph-dark.svg
