name: Generate Profile Summary Cards

on:
  schedule:
    - cron: "42 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/profile-summary.yml"

permissions:
  contents: write

jobs:
  build:
    name: Generate GitHub profile summary cards
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: muscledevnerd
          BRANCH_NAME: ${{ github.ref_name }}
          UTC_OFFSET: -4
          EXCLUDE: ""
          AUTO_PUSH: false

      - name: Sync latest branch state
        run: |
          git stash push --include-untracked -m generated-summary-cards || true
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git stash pop || true

      - name: Commit generated summary cards
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update profile summary cards"
          file_pattern: profile-summary-card-output/**
