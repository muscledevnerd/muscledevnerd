<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="72" viewBox="0 0 1200 72" role="img" aria-labelledby="title desc" preserveAspectRatio="none">
  <title id="title">Animated gradient divider</title>
  <desc id="desc">A thin animated gradient divider with a terminal-inspired center symbol on a transparent background.</desc>
  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea" stop-opacity="0" />
      <stop offset="35%" stop-color="#667eea" />
      <stop offset="65%" stop-color="#f093fb" />
      <stop offset="100%" stop-color="#764ba2" stop-opacity="0" />
      <animate attributeName="x1" values="0%;15%;0%" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;85%;100%" dur="6s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <line x1="64" y1="36" x2="1136" y2="36" stroke="url(#line)" stroke-width="2" />
  <rect x="552" y="16" width="96" height="40" rx="20" fill="#0d1117" stroke="#30363d" />
  <text x="600" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#c9d1d9">&lt;/&gt;</text>
</svg>
