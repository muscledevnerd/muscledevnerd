<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Footer for Mridul Khanna</title>
  <desc id="desc">Animated dark footer matching the hero style with Mridul Khanna's role and location.</desc>
  <defs>
    <linearGradient id="footerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="55%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#111827" />
      <animate attributeName="x1" values="0;.18;0" dur="10s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="footerAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#667eea" />
      <stop offset="50%" stop-color="#764ba2" />
      <stop offset="100%" stop-color="#f093fb" />
    </linearGradient>
    <style><![CDATA[
      .name { font: 800 34px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #f0f6fc; }
      .meta { font: 500 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #8b949e; }
      .code { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #c9d1d9; opacity: .7; }
      .move { stroke-dasharray: 12 18; animation: dash 8s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -240; } }
    ]]></style>
  </defs>
  <rect width="1200" height="210" rx="24" fill="url(#footerBg)" />
  <path class="move" d="M90 58 H330 C390 58 390 100 450 100 H750 C810 100 810 152 870 152 H1110" fill="none" stroke="url(#footerAccent)" stroke-width="2" opacity="0.42" />
  <text x="600" y="84" text-anchor="middle" class="name">Mridul Khanna</text>
  <text x="600" y="119" text-anchor="middle" class="meta">Senior Full-Stack Software Engineer</text>
  <text x="600" y="151" text-anchor="middle" class="meta">Toronto, Canada</text>
  <text x="600" y="181" text-anchor="middle" class="code">build for today :: design for change :: engineer for trust</text>
</svg>
