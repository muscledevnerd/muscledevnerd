<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Mridul Khanna - Senior Full-Stack Software Engineer</title>
  <desc id="desc">Animated dark developer header with gradient, circuit lines, particles, and professional profile details for Mridul Khanna in Toronto, Canada.</desc>
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="45%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#111827" />
      <animate attributeName="x1" values="0%;20%;0%" dur="12s" repeatCount="indefinite" />
      <animate attributeName="y2" values="100%;80%;100%" dur="12s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea" />
      <stop offset="50%" stop-color="#764ba2" />
      <stop offset="100%" stop-color="#f093fb" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#667eea" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#667eea" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#30363d" stroke-width="1" opacity="0.35" />
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <style><![CDATA[
      .name { font: 800 58px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; letter-spacing: -1px; fill: #f0f6fc; }
      .role { font: 600 26px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #c9d1d9; }
      .meta { font: 500 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #8b949e; }
      .code { font: 500 15px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #8b949e; }
      .chip { font: 700 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #c9d1d9; }
      .line { stroke-dasharray: 18 16; animation: dash 10s linear infinite; }
      .particle { animation: float 7s ease-in-out infinite; }
      .particle:nth-of-type(2n) { animation-delay: -2s; }
      .particle:nth-of-type(3n) { animation-delay: -4s; }
      @keyframes dash { to { stroke-dashoffset: -340; } }
      @keyframes float { 0%,100% { transform: translateY(0); opacity: .35; } 50% { transform: translateY(-12px); opacity: .9; } }
    ]]></style>
  </defs>
  <rect width="1200" height="420" rx="26" fill="url(#bgGradient)" />
  <rect width="1200" height="420" rx="26" fill="url(#grid)" opacity="0.55" />
  <circle cx="965" cy="94" r="220" fill="url(#glow)" />
  <circle cx="170" cy="355" r="150" fill="url(#glow)" opacity="0.55" />

  <g opacity="0.9" filter="url(#softGlow)">
    <path class="line" d="M770 92 H940 C985 92 985 150 1035 150 H1120" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.55" />
    <path class="line" d="M730 304 H890 C940 304 942 248 990 248 H1145" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.45" />
    <path class="line" d="M64 122 H230 C280 122 280 178 330 178 H475" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.35" />
  </g>

  <g class="particle" fill="#f093fb">
    <circle cx="1005" cy="150" r="4" />
    <circle cx="1094" cy="248" r="3" />
    <circle cx="282" cy="178" r="3" />
    <circle cx="875" cy="92" r="3" />
    <circle cx="210" cy="122" r="3" />
  </g>

  <g transform="translate(84 88)">
    <rect x="0" y="0" width="104" height="32" rx="16" fill="#161b22" stroke="#30363d" />
    <text x="52" y="21" text-anchor="middle" class="chip">10 YEARS</text>
    <text x="0" y="82" class="name">Mridul Khanna</text>
    <rect x="0" y="105" width="535" height="4" rx="2" fill="url(#accent)" />
    <text x="0" y="154" class="role">Senior Full-Stack Software Engineer</text>
    <text x="0" y="193" class="meta">Java &#8226; Spring Boot &#8226; Angular &#8226; React</text>
    <text x="0" y="228" class="meta">Toronto, Canada</text>
  </g>

  <g transform="translate(758 174)">
    <rect x="0" y="0" width="330" height="132" rx="18" fill="#161b22" stroke="#30363d" opacity="0.92" />
    <text x="24" y="38" class="code" fill="#667eea">&gt; build --secure --scalable</text>
    <text x="24" y="68" class="code">clean-architecture: enabled</text>
    <text x="24" y="98" class="code">delivery-quality: reviewed</text>
  </g>
</svg>
