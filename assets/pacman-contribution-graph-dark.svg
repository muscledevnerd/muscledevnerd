<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="290" viewBox="0 0 1100 290" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Pac-Man contribution graph placeholder</title>
  <desc id="desc">A local fallback Pac-Man style contribution graph for muscledevnerd. The GitHub Actions workflow refreshes this asset with live contribution data.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#667eea" />
      <stop offset="55%" stop-color="#764ba2" />
      <stop offset="100%" stop-color="#f093fb" />
    </linearGradient>
    <style><![CDATA[
      .label { font: 700 19px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #c9d1d9; }
      .small { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
      .pac { animation: chomp .45s steps(2, end) infinite, travel 9s linear infinite; transform-origin: center; }
      .ghost { animation: bob 2.4s ease-in-out infinite; }
      @keyframes chomp { 50% { opacity: .78; } }
      @keyframes travel { from { transform: translateX(0); } to { transform: translateX(820px); } }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    ]]></style>
  </defs>
  <rect width="1100" height="290" rx="18" fill="#0d1117" />
  <rect x="26" y="26" width="1048" height="238" rx="18" fill="#161b22" stroke="#30363d" opacity="0.96" />
  <text x="54" y="58" class="label">Contribution graph animation</text>
  <text x="54" y="246" class="small">Generated daily for muscledevnerd by .github/workflows/pacman.yml</text>
