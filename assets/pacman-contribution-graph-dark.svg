<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">Pac-Man contribution graph for muscledevnerd</title>
  <desc id="desc">Pac-Man themed contribution graph for muscledevnerd. It is refreshed by GitHub Actions and can use PROFILE_GITHUB_TOKEN for broader authorized contribution visibility.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#667eea" />
      <stop offset="55%" stop-color="#764ba2" />
      <stop offset="100%" stop-color="#f093fb" />
    </linearGradient>
    <style><![CDATA[
      .title { font: 800 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #c9d1d9; }
      .note { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
      .pac { animation: travel 8s linear infinite; transform-origin: center; }
      .mouth { animation: chomp .45s steps(2, end) infinite; transform-origin: 28px 0; }
      .ghost { animation: bob 2.2s ease-in-out infinite; }
      @keyframes travel { from { transform: translateX(0); } to { transform: translateX(830px); } }
      @keyframes chomp { 50% { transform: rotate(18deg); } }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    ]]></style>
  </defs>
