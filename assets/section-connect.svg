<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="132" viewBox="0 0 1200 132" role="img" aria-labelledby="title-connect desc-connect" preserveAspectRatio="xMidYMid meet">
  <title id="title-connect">Connect</title>
  <desc id="desc-connect">GitHub, LinkedIn, and portfolio links for Mridul Khanna.</desc>
  <defs>
    <style><![CDATA[
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --surface-2: #1f2633;
        --chrome: #10151f;
        --border: #30363d;
        --text: #c9d1d9;
        --muted: #8b949e;
        --heading: #f0f6fc;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --surface: #f6f8fa;
          --surface-2: #eef2ff;
          --chrome: #eef2ff;
          --border: #d0d7de;
          --text: #24292f;
          --muted: #57606a;
          --heading: #0f172a;
        }
      }
    ]]></style>
        <linearGradient id="accent-connect" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#667eea" />
      <stop offset="50%" stop-color="#764ba2" />
      <stop offset="100%" stop-color="#f093fb" />
      <animate attributeName="x1" values="0;0.2;0" dur="8s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="glow-connect" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <style><![CDATA[
      .heading { font: 800 38px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: var(--heading); letter-spacing: .2px; }
      .kicker { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--muted); letter-spacing: 2.4px; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:.38; } 50% { opacity:.9; } }
    ]]></style>
  </defs>
  <rect x="446" y="22" width="308" height="88" rx="28" fill="var(--surface)" stroke="var(--border)" />
  <rect x="448" y="24" width="304" height="84" rx="26" fill="url(#accent-connect)" opacity="0.10" />
  <line x1="96" y1="66" x2="418" y2="66" stroke="url(#accent-connect)" stroke-width="2" opacity="0.65" />
  <line x1="782" y1="66" x2="1104" y2="66" stroke="url(#accent-connect)" stroke-width="2" opacity="0.65" />
  <circle class="pulse" cx="404" cy="66" r="5" fill="#f093fb" filter="url(#glow-connect)" />
  <circle class="pulse" cx="796" cy="66" r="5" fill="#667eea" filter="url(#glow-connect)" />
  <text x="600" y="56" text-anchor="middle" class="kicker">MRIDUL KHANNA</text>
  <text x="600" y="92" text-anchor="middle" class="heading">Connect</text>
</svg>
