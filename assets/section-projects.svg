<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="132" viewBox="0 0 1200 132" role="img" aria-labelledby="title-featured-projects desc-featured-projects" preserveAspectRatio="xMidYMid meet">
  <title id="title-featured-projects">Featured Projects</title>
  <desc id="desc-featured-projects">Project placeholders for enterprise workflow, developer productivity, and cloud-native API work.</desc>
  <defs>
    <linearGradient id="accent-featured-projects" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#667eea" />
      <stop offset="50%" stop-color="#764ba2" />
      <stop offset="100%" stop-color="#f093fb" />
      <animate attributeName="x1" values="0;0.2;0" dur="8s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="glow-featured-projects" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <style><![CDATA[
      .heading { font: 800 38px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #f0f6fc; letter-spacing: .2px; }
      .kicker { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; letter-spacing: 2.4px; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:.38; } 50% { opacity:.9; } }
    ]]></style>
  </defs>
  <rect x="326" y="22" width="548" height="88" rx="28" fill="#161b22" stroke="#30363d" />
  <rect x="328" y="24" width="544" height="84" rx="26" fill="url(#accent-featured-projects)" opacity="0.10" />
  <line x1="96" y1="66" x2="298" y2="66" stroke="url(#accent-featured-projects)" stroke-width="2" opacity="0.65" />
  <line x1="902" y1="66" x2="1104" y2="66" stroke="url(#accent-featured-projects)" stroke-width="2" opacity="0.65" />
  <circle class="pulse" cx="284" cy="66" r="5" fill="#f093fb" filter="url(#glow-featured-projects)" />
  <circle class="pulse" cx="916" cy="66" r="5" fill="#667eea" filter="url(#glow-featured-projects)" />
  <text x="600" y="56" text-anchor="middle" class="kicker">MRIDUL KHANNA</text>
  <text x="600" y="92" text-anchor="middle" class="heading">Featured Projects</text>
</svg>
