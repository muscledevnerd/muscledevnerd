<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Animated terminal introduction for Mridul Khanna</title>
  <desc id="desc">A dark terminal window revealing commands that summarize Mridul Khanna's role, location, experience, stack, learning areas, and engineering mission.</desc>
  <defs>
    <style><![CDATA[
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --surface-2: #1f2633;
        --chrome: #10151f;
        --border: #30363d;
        --text: #c9d1d9;
        --muted: #8b949e;
        --heading: #f0f6fc;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --surface: #f6f8fa;
          --surface-2: #eef2ff;
          --chrome: #eef2ff;
          --border: #d0d7de;
          --text: #24292f;
          --muted: #57606a;
          --heading: #0f172a;
        }
      }
    ]]></style>
        <linearGradient id="termBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea" />
      <stop offset="55%" stop-color="#764ba2" />
      <stop offset="100%" stop-color="#f093fb" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <style><![CDATA[
      .prompt { fill: #667eea; font: 600 17px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .out { fill: var(--text); font: 500 17px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .muted { fill: var(--muted); font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .line { opacity: 0; animation: reveal .45s ease forwards; }
      .l1 { animation-delay: .2s; } .l2 { animation-delay: .65s; }
      .l3 { animation-delay: 1.1s; } .l4 { animation-delay: 1.55s; }
      .l5 { animation-delay: 2s; } .l6 { animation-delay: 2.45s; }
      .l7 { animation-delay: 2.9s; } .l8 { animation-delay: 3.35s; }
      .l9 { animation-delay: 3.8s; } .l10 { animation-delay: 4.25s; }
      .l11 { animation-delay: 4.7s; } .l12 { animation-delay: 5.15s; }
      .l13 { animation-delay: 5.6s; } .l14 { animation-delay: 6.05s; }
      .cursor { animation: blink 1s steps(2, start) infinite; }
      @keyframes reveal { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes blink { 0%,45% { opacity: 1; } 46%,100% { opacity: 0; } }
    ]]></style>
  </defs>
  <rect width="1200" height="460" rx="22" fill="var(--bg)" />
  <rect x="78" y="42" width="1044" height="376" rx="20" fill="url(#termBorder)" opacity="0.95" filter="url(#shadow)" />
  <rect x="80" y="44" width="1040" height="372" rx="18" fill="var(--surface)" />
  <rect x="80" y="44" width="1040" height="48" rx="18" fill="var(--chrome)" />
  <circle cx="111" cy="68" r="7" fill="#ff5f57" />
  <circle cx="135" cy="68" r="7" fill="#ffbd2e" />
  <circle cx="159" cy="68" r="7" fill="#28c840" />
  <text x="600" y="73" text-anchor="middle" class="muted">mridul@engineering-profile: ~/career</text>

  <g transform="translate(122 125)">
    <text class="prompt line l1" x="0" y="0">$ whoami</text>
    <text class="out line l2" x="0" y="28">Mridul Khanna</text>
    <text class="prompt line l3" x="0" y="56">$ role</text>
    <text class="out line l4" x="0" y="84">Senior Full-Stack Software Engineer</text>
    <text class="prompt line l5" x="0" y="112">$ location</text>
    <text class="out line l6" x="0" y="140">Toronto, Canada</text>
    <text class="prompt line l7" x="0" y="168">$ experience</text>
    <text class="out line l8" x="0" y="196">10 years</text>

    <text class="prompt line l9" x="520" y="0">$ stack</text>
    <text class="out line l10" x="520" y="28">Java &#8226; Spring Boot &#8226; Angular</text>
    <text class="out line l10" x="520" y="56">React &#8226; TypeScript &#8226; JavaScript &#8226; SQL</text>
    <text class="prompt line l11" x="520" y="98">$ currently-learning</text>
    <text class="out line l12" x="520" y="126">AWS &#8226; Docker &#8226; System Design</text>
    <text class="out line l12" x="520" y="154">Applied AI &#8226; CI/CD</text>
    <text class="prompt line l13" x="520" y="190">$ mission</text>
    <text class="out line l14" x="520" y="218">Build secure, scalable and</text>
    <text class="out line l14" x="520" y="246">maintainable software.</text>
    <rect class="cursor" x="520" y="268" width="10" height="20" fill="#f093fb" />
  </g>
</svg>
