<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220" role="img" aria-labelledby="title desc">
  <title id="title">Profile summary card</title>
  <desc id="desc">Placeholder profile summary card for muscledevnerd. The profile-summary workflow refreshes this file with generated GitHub analytics.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea" />
      <stop offset="55%" stop-color="#764ba2" />
      <stop offset="100%" stop-color="#f093fb" />
    </linearGradient>
  </defs>
  <rect width="920" height="220" rx="18" fill="#0d1117" />
  <rect x="1" y="1" width="918" height="218" rx="17" fill="#161b22" stroke="#30363d" />
  <rect x="28" y="30" width="6" height="160" rx="3" fill="url(#g)" />
  <text x="54" y="76" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#f0f6fc">Profile summary card</text>
  <text x="54" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#c9d1d9">Awaiting generated public GitHub summary.</text>
  <text x="54" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8b949e">Generated daily by .github/workflows/profile-summary.yml</text>
  <text x="54" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8b949e">username: muscledevnerd</text>
</svg>
